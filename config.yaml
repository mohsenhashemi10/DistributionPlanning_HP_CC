project:
  name: thermal_dnep

paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  results: results
  models: results/models
  figures: results/figures
  tables: results/tables
  logs: results/logs

database:  
  server: 's173'  
  database: 'NewWebServer'  
  driver: 'sql server'  
  trusted_connection: true

